[package]
name = "macos-dev-cache-cleaner"
version = "0.1.0"
default-run = "macos-dev-cache-cleaner"
description = "Safe macOS developer cache cleaner for AI/dev machines"
authors = ["CS Teacher + ChatGPT"]
edition = "2021"
license = "MIT"

[lib]
name = "macos_dev_cache_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
walkdir = "2"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
